version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: printqueue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: printqueue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printqueue -d printqueue"]
      interval: 5s
      timeout: 5s
      retries: 5


  temporal:
    image: temporalio/auto-setup:1.22.7
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=printqueue
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_SEEDS=db
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    depends_on:
      db:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  web:
    build: .
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src:/app/src
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://printqueue:${POSTGRES_PASSWORD:-password}@db:5432/printqueue}
      - TEMPORAL_TARGET=temporal:7233
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: watchfiles --filter default 'python -m src.worker.main' ./src
    volumes:
      - ./src:/app/src
      - ./watched_folder:/watched_folder
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://printqueue:${POSTGRES_PASSWORD:-password}@db:5432/printqueue}
      - TEMPORAL_TARGET=temporal:7233
      - OLLAMA_HOST=http://ollama:11434
      - WATCH_DIRECTORY=/watched_folder
    depends_on:
      db:
        condition: service_healthy

  watchdog:
    build: .
    command: watchfiles --filter default 'python -m src.watchdog.main' ./src
    volumes:
      - ./src:/app/src
      - ./watched_folder:/watched_folder
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://printqueue:${POSTGRES_PASSWORD:-password}@db:5432/printqueue}
      - WATCH_DIRECTORY=/watched_folder
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
