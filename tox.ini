[tox]
envlist = py310, ruff, pylint, mypy
isolated_build = True

[testenv]
deps =
    pytest
    pytest-asyncio
    pytest-cov
    hypothesis
    fastapi
    httpx
    sqlalchemy
    pydantic
    pydantic-ai
    celery
    redis
    watchdog
    ollama
    psycopg2-binary
    playwright
commands =
    pytest tests/ --cov=src --cov-fail-under=85

[testenv:ruff]
deps = ruff
commands = ruff check src/ tests/

[testenv:pylint]
deps = pylint
commands = pylint src/ tests/ --disable=C0114,C0115,C0116,C0103,C0411,R0903,W0718,C0303,C0301,W0613,E0401,C1803,W0212,R0801

[testenv:mypy]
deps =
    mypy
    playwright
commands = mypy src/ tests/ --explicit-package-bases --ignore-missing-imports --disable-error-code untyped-decorator --disable-error-code no-untyped-def --disable-error-code union-attr --disable-error-code attr-defined --disable-error-code call-overload --disable-error-code unused-ignore --disable-error-code misc --disable-error-code assignment --disable-error-code comparison-overlap
