<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deleted Jobs - 3D Print Queue Manager</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <style>
      .status-PRINTED {
        text-decoration: line-through;
        opacity: 0.7;
      }
      .status-SKIPPED {
        opacity: 0.5;
      }

      table img {
        border-radius: 0.5rem;
        object-fit: cover;
        max-width: 80px;
        max-height: 80px;
        opacity: 0.8;
        filter: grayscale(100%);
      }

      .no-img {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 80px;
        height: 80px;
        background-color: var(--pico-muted-border-color);
        color: var(--pico-h1-color);
        border-radius: 0.5rem;
        font-size: 0.8rem;
      }

      .source-badge {
        background-color: var(--pico-muted-border-color);
        color: var(--pico-color);
        padding: 0.25rem 0.5rem;
        border-radius: 1rem;
        font-size: 0.8rem;
        font-weight: bold;
      }

      .actions-col {
        min-width: 120px;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <header>
        {% set page_title = "Deleted Jobs" %} {% set page_subtitle = "History of
        deleted, skipped, and printed models." %} {% include 'nav.html' with
        context %}
      </header>

      <article>
        <div
          style="
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
          "
        >
          <label for="show-deleted-printed">
            <input
              type="checkbox"
              id="show-deleted-printed"
              name="show_printed"
              value="true"
              {%
              if
              show_printed
              %}checked{%
              endif
              %}
              hx-get="/deleted"
              hx-target="#deleted-job-list"
              hx-swap="innerHTML"
            />
            Show PRINTED Jobs
          </label>
        </div>
        <figure>
          <table role="grid">
            <thead>
              <tr>
                <th scope="col">Thumbnail</th>
                <th scope="col">Title</th>
                <th scope="col">Source</th>
                <th scope="col">Original Status</th>
                <th scope="col">Notes</th>
                <th scope="col">Deleted At</th>
                <th scope="col" class="actions-col">Actions</th>
              </tr>
            </thead>
            <tbody id="deleted-job-list">
              {% include 'deleted_job_list.html' %}
            </tbody>
          </table>
        </figure>
      </article>
    </main>
  </body>
</html>
