<tr id="job-{{ job.id }}" data-job-id="{{ job.id }}" class="status-{{ job.status.value.replace(' ', '-') }}">
    <td class="drag-handle" aria-label="Drag to reorder" title="Drag to reorder">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
          <path d="M2 3.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5zm0 4a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5zm0 4a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5z"/>
        </svg>
    </td>
    <td class="td-thumbnail">
        {% if job.thumbnail_url %}
            <img src="{{ job.thumbnail_url }}" class="thumbnail" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'" alt="Thumbnail">
            <div class="thumbnail-placeholder" style="display: none;">No Img</div>
        {% else %}
            <div class="thumbnail-placeholder">No Img</div>
        {% endif %}
    </td>
    <td>
        <strong>{{ job.title }}</strong><br>
        <small style="color: var(--pico-muted-color);">By {{ job.author or 'Unknown' }}</small>
    </td>
    <td>
        <span class="source-badge">{{ job.source }}</span>
        {% if job.source_url %}
            <a href="{{ job.source_url }}" target="_blank" style="margin-left: 0.5rem;">
                <small>Link ↗</small>
            </a>
        {% endif %}
    </td>
    <td>
        <form hx-post="/jobs/{{ job.id }}/status" hx-target="#job-{{ job.id }}" hx-swap="outerHTML">
            <select name="status" aria-label="Status" onchange="this.form.requestSubmit()" style="margin-bottom: 0; min-width: 160px; padding: 0.25rem;">
                <option value="TO BE PRINTED" {% if job.status.value == 'TO BE PRINTED' %}selected{% endif %}>TO BE PRINTED</option>
                <option value="PRINT IN PROGRESS" {% if job.status.value == 'PRINT IN PROGRESS' %}selected{% endif %}>PRINT IN PROGRESS</option>
                <option value="PRINT AGAIN" {% if job.status.value == 'PRINT AGAIN' %}selected{% endif %}>PRINT AGAIN</option>
                <option value="PRINTED" {% if job.status.value == 'PRINTED' %}selected{% endif %}>PRINTED</option>
                <option value="SKIPPED" {% if job.status.value == 'SKIPPED' %}selected{% endif %}>SKIPPED</option>
            </select>
        </form>
    </td>
    <td>
        <form hx-post="/jobs/{{ job.id }}/notes" hx-swap="none">
            <input type="text" name="material_notes" value="{{ job.material_notes or '' }}" placeholder="Material" hx-trigger="blur" style="margin-bottom: 0.5rem; padding: 0.25rem;">
            <input type="text" name="timing_notes" value="{{ job.timing_notes or '' }}" placeholder="Timing" hx-trigger="blur" style="margin-bottom: 0; padding: 0.25rem;">
        </form>
    </td>
    <td>
        <button class="secondary outline"
                hx-post="/jobs/{{ job.id }}/delete"
                hx-target="#job-{{ job.id }}"
                hx-swap="outerHTML"
                hx-confirm="Are you sure you want to delete this job?"
                style="padding: 0.25rem 0.5rem; border-color: var(--pico-del-color, #e53935); color: var(--pico-del-color, #e53935);">
            Delete
        </button>
    </td>
</tr>
