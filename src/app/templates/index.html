<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local 3D Print Queue Manager</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-PRINTED { text-decoration: line-through; color: #888; }
        .status-SKIPPED { opacity: 0.6; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Local 3D Print Queue Manager</h1>
        <p class="lead">Aggregating models from Local, MakerWorld, Printables, and more.</p>

        <div class="table-responsive bg-white rounded shadow-sm p-4">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th scope="col">Thumbnail</th>
                        <th scope="col">Title</th>
                        <th scope="col">Source</th>
                        <th scope="col">Status</th>
                        <th scope="col">Notes</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody id="job-list">
                    {% for job in jobs %}
                        {% include 'job_row.html' %}
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
