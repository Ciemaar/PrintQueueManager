name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.14"
        enable-cache: true
    - name: Run Ruff
      run: uv run ruff check src/ tests/

  typecheck:
    name: Type Check (Pyright)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.14"
        enable-cache: true
    - name: Run Pyright
      run: uv run pyright src/ tests/

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    needs: [lint, typecheck]

    steps:
    - uses: actions/checkout@v6
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.14"
        enable-cache: true
    - name: Install Playwright system dependencies
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          uv run playwright install --with-deps chromium
        else
          uv run playwright install chromium
        fi
      shell: bash
    - name: Run tests with coverage
      run: uv run pytest tests/ --cov=src --cov-fail-under=85 --cov-report=xml
      env:
        PYTHONPATH: .
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
