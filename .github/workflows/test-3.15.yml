name: Python 3.15 Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Run weekly to catch ecosystem updates

jobs:
  test-3-15:
    runs-on: ubuntu-latest
    continue-on-error: true # Allow this to fail until the ecosystem catches up

    steps:
    - uses: actions/checkout@v7

    - name: Install uv and set up Python 3.15 prerelease
      uses: astral-sh/setup-uv@v4
      with:
        python-version: "3.15" # This pulls the latest prerelease and transitions to stable
        enable-cache: true

    - name: Install system dependencies (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev

    - name: Install dependencies
      # We ignore the lockfile for this run, because we want to pull the latest versions
      # that might have 3.15 fixes, and many dependencies might not resolve otherwise.
      # Setting PYO3_USE_ABI3_FORWARD_COMPATIBILITY helps bypass PyO3 python version constraints
      env:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        HYPOTHESIS_NO_NATIVE: "1"
      run: |
        uv venv
        uv pip install -e ".[dev]"

    - name: Install Playwright system dependencies
      run: |
        uv run playwright install --with-deps chromium
      continue-on-error: true

    - name: Run tests (no coverage due to ecosystem limits)
      env:
        PYTHONPATH: .
      run: |
        uv run pytest tests/
