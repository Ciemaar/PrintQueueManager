[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "print-queue-manager"
version = "0.1.0"
description = "A Local, Agentic 3D Print Queue Management System"
authors = [
    { name = "Developer", email = "dev@example.com" }
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "pydantic-ai",
    "sqlalchemy",
    "psycopg2-binary",
    "alembic",
    "celery",
    "redis",
    "watchdog",
    "jinja2",
    "python-multipart",
    "requests",
    "httpx",
    "ollama",
    "playwright"
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "tox",
    "ruff",
    "pylint",
    "mypy"
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "D",  # pydocstyle
]
ignore = [
    "D104", # Allow tests without docstrings for brevity
    "D100", # Missing module docstring
    "D211", "D212", "D203" # Styling rules conflicts
]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-v --cov=src --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
